[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pmm-mongodb-discovery-mcp"
version = "0.1.0"
description = "MCP server for discovering MongoDB services from Percona PMM"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.27,<2",
  "python-dotenv>=1.0",
]

[project.scripts]
pmm-mongodb-discovery = "pmm_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pmm_mcp"]
